<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-b from-violet-700 to-rose-200 h-screen flex justify-center items-center">
    <div class="bg-white shadow-lg rounded-lg px-4">
        <h1 class="font-bold text-xl mb-6 my-4">Seja bem vindo(a).</h1>
        <form class="flex flex-col w-80">
            <label class="uppercase text-xs font-bold mb-2 block" for="email">Email</label>
            <input class="pl-3 h-10 border-2 border-violet-200 focus:border-purple-400  duration-150 rounded outline-none mb-4" type="email" placeholder="email@email.com"/>

            <label for="senha" class="uppercase text-xs font-bold mb-2 block">Senha</label>
            <input type="password" placeholder="********" class="pl-3 h-10 border-2 border-violet-200 focus:border-purple-400  duration-150 rounded outline-none mb-4"/>

            <a href="/cadastrar.html" class="my-5">Cadastre-se</a>
            <button type="submit" class="w-full h-10 rounded bg-purple-400 hover:bg-indigo-600 duration-200 hover:text-white mb-4">Login</button>
        </form>
    </div>
    
</body>

</html>
